<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resumes - Gopika Chauhan</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
            background: #f3e5dc;
            color: #333;
        }

        nav {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(255, 250, 245, 0.95);
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
            padding: 20px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            border-bottom: 1px solid rgba(230, 180, 160, 0.3);
        }

        .logo {
            font-size: 24px;
            font-weight: 700;
            color: #8b6f5c;
            letter-spacing: 2px;
        }

        .logo span {
            background: linear-gradient(135deg, #d4a5a5 0%, #c98d8d 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-links {
            display: flex;
            gap: 40px;
            list-style: none;
        }

        .nav-links a {
            color: #8b6f5c;
            text-decoration: none;
            font-size: 14px;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: all 0.3s;
            position: relative;
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 0;
            height: 2px;
            background: linear-gradient(135deg, #d4a5a5 0%, #c98d8d 100%);
            transition: width 0.3s;
        }

        .nav-links a:hover::after {
            width: 100%;
        }

        .menu-toggle {
            display: none;
            flex-direction: column;
            cursor: pointer;
            gap: 6px;
            z-index: 1001;
        }

        .bar {
            width: 30px;
            height: 3px;
            background-color: #8b6f5c;
            transition: all 0.3s ease;
        }

        .resume-container {
            min-height: 100vh;
            padding: 150px 150px 100px;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: url('images/resume.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            position: relative;
        }

        .resume-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.68);
            z-index: 1;
        }

        .resume-content {
            position: relative;
            z-index: 2;
            max-width: 850px;
            width: 100%;
            padding: 60px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.08);
            -webkit-backdrop-filter: blur(12px);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            color: #f3eee8;
            text-align: center;
            animation: fadeInUp 1s ease-out;
        }

        .eyebrow {
            display: inline-block;
            margin-bottom: 16px;
            padding: 8px 16px;
            border-radius: 999px;
            background: rgba(212, 165, 165, 0.15);
            border: 1px solid rgba(212, 165, 165, 0.35);
            color: #f2d7d7;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-size: 12px;
        }

        h1 {
            font-size: 48px;
            font-weight: 800;
            margin-bottom: 18px;
            background: linear-gradient(135deg, #fff 0%, #d4a5a5 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        p {
            color: #f0f0f0;
            margin-bottom: 28px;
            line-height: 1.8;
            font-size: 18px;
        }

        .resume-links {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        a.resume-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 14px 22px;
            min-width: 180px;
            background: linear-gradient(135deg, #d4a5a5 0%, #c98d8d 100%);
            color: #fff;
            text-decoration: none;
            border-radius: 999px;
            font-weight: 600;
            letter-spacing: 0.5px;
            transition: transform 0.3s, box-shadow 0.3s;
            box-shadow: 0 10px 20px rgba(212, 165, 165, 0.25);
        }

        a.resume-link:hover {
            transform: translateY(-3px);
            box-shadow: 0 14px 28px rgba(212, 165, 165, 0.4);
        }

        .note {
            margin-top: 26px;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.75);
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 768px) {
            nav {
                padding: 20px;
            }

            .menu-toggle {
                display: flex;
            }

            .nav-links {
                position: fixed;
                top: 0;
                right: -100%;
                height: 100vh;
                width: 100%;
                background: rgba(255, 250, 245, 0.98);
                flex-direction: column;
                justify-content: center;
                align-items: center;
                transition: right 0.3s ease;
                z-index: 1000;
            }

            .nav-links.active {
                right: 0;
            }

            .nav-links a {
                font-size: 24px;
                color: #8b6f5c;
            }

            .menu-toggle.active .bar:nth-child(1) {
                transform: translateY(9px) rotate(45deg);
            }

            .menu-toggle.active .bar:nth-child(2) {
                opacity: 0;
            }

            .menu-toggle.active .bar:nth-child(3) {
                transform: translateY(-9px) rotate(-45deg);
            }

            .resume-container {
                padding: 100px 20px 50px;
                background-attachment: scroll;
            }

            .resume-content {
                padding: 32px 24px;
            }

            h1 {
                font-size: 34px;
            }

            p {
                font-size: 16px;
            }

            .resume-links {
                flex-direction: column;
            }

            a.resume-link {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <nav>
        <div class="logo">GOPIKA <span>CHAUHAN</span></div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="experience.html">Experience</a></li>
            <li><a href="projects.html">Projects</a></li>
            <li><a href="skills.html">Skills</a></li>
            <li><a href="creativity.html">Creativity</a></li>
        </ul>
        <div class="menu-toggle">
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
        </div>
    </nav>

    <div class="resume-container">
        <div class="resume-overlay"></div>
        <div class="resume-content">
            <div class="eyebrow">Resume Section</div>
            <h1>Resumes</h1>
            <p>Here are my resumes in different formats:</p>
            <div class="resume-links">
                <a class="resume-link" href="https://drive.google.com/file/d/1EPofi0zIIjUvhT__n6q-O_l59HTfnznR/view?usp=sharing" target="_blank" rel="noopener noreferrer">SWE Resume</a>
                <a class="resume-link" href="https://drive.google.com/file/d/1UVeL6W4P_Skv_L9hedsy_HNlIvvgrfQg/view?usp=sharing" target="_blank" rel="noopener noreferrer">Web3 Resume</a>
            </div>
            <p class="note">These links open in new tabs.</p>
        </div>
    </div>

    <script>
        const menuToggle = document.querySelector('.menu-toggle');
        const navLinks = document.querySelector('.nav-links');

        menuToggle.addEventListener('click', () => {
            menuToggle.classList.toggle('active');
            navLinks.classList.toggle('active');
        });
    </script>
</body>
</html>
